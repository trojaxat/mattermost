services:
  mattermost:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mattermost:${POSTGRES_PASSWORD}@zhujynremvhe39q7wlxr7cj5:5432/mattermost?sslmode=disable&connect_timeout=10

      MM_FILESETTINGS_DRIVERNAME: amazons3
      MM_FILESETTINGS_AMAZONS3BUCKET: mattermost
      MM_FILESETTINGS_AMAZONS3ACCESSKEYID: ${MINIO_ROOT_USER}
      MM_FILESETTINGS_AMAZONS3SECRETACCESSKEY: ${MINIO_ROOT_PASSWORD}
      MM_FILESETTINGS_AMAZONS3ENDPOINT: http://minio:9000
      MM_FILESETTINGS_AMAZONS3SSL: "false"

      MM_SERVICESETTINGS_SITEURL: ${MATTERMOST_SITE_URL}
    ports:
      - "8065:8065"
    volumes:
      - mattermost_config:/mattermost/config
      - mattermost_data:/mattermost/data
      - mattermost_logs:/mattermost/logs
      - mattermost_plugins:/mattermost/plugins
      - mattermost_client_plugins:/mattermost/client/plugins
      - mattermost_bleve:/mattermost/bleve-indexes

volumes:
  mattermost_config:
  mattermost_data:
  mattermost_logs:
  mattermost_plugins:
  mattermost_client_plugins:
  mattermost_bleve:
